 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }

    .main {
      background-color: skyblue;
      color: black;
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid white;
    }

    .nav {
      background-color: slategray;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 1.2rem;
    }

    .nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }

    .login {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form {
      /* Background image added here */
      background-image: url("login-bg.jpg"); /* replace with your image path */
      background-size: cover;
      background-position: center;
      width: 600px;
      height: 350px;
      margin: 40px;
      padding: 40px;
      border: 1px solid black;
      border-radius: 12px;
      box-shadow: 0px 0px 15px black;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #403f3f;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4facfe;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0aa8d4;
    }
    .image{
      background-image: url("C:\Users\Crown tech\Desktop\university.jpg"); 
      
      background-size: cover;
        background-position: center;
         background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div class="main">
    <h3>ONLINE CLASS</h3>
    <h4>ATTENDANCE</h4>
  </div>

  <div class="nav">
    
  </div>
<div class="image">
  <img></img>
</div>
  <div class="login">
    <div class="form">
      <div class="login-container">
        <h2>LOGIN FORM</h2>
        <label for="username">Username:</label>
        <input type="text" class="username" placeholder="username">
        <label for="password">Password:</label>
        <input type="password" class="password" placeholder="password">
        <button onclick="login()">Login</button>
      </div>
    </div>
  </div>

  <script>
    function login() {
      let user = document.querySelector(".username").value;
      let pass = document.querySelector(".password").value;
      if (user === "admin" && pass === "1234") {
        alert("🎉 Congratulations " + user + "! Login successful.");
        window.location = "Attendance.html";
      } else {
        alert("❌ Failed password, try again!");
      }
    }
  </script>
</body>
</html>
